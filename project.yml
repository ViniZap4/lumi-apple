name: Lumi
options:
  bundleIdPrefix: com.vinizap.lumi
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    visionOS: "2.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  LumiPackages:
    path: .

targets:
  Lumi:
    type: application
    supportedDestinations: [iOS, iPadOS, macOS, visionOS]
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: LumiPackages
        product: LumiKit
      - package: LumiPackages
        product: LumiUI
    settings:
      base:
        PRODUCT_NAME: Lumi
        PRODUCT_BUNDLE_IDENTIFIER: com.vinizap.lumi
        INFOPLIST_KEY_CFBundleDisplayName: Lumi
        INFOPLIST_KEY_NSHumanReadableCopyright: "© Lumi"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Resources/Lumi.entitlements
        TARGETED_DEVICE_FAMILY: "1,2,7"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        XROS_DEPLOYMENT_TARGET: "2.0"
        CODE_SIGN_STYLE: Automatic
