included:
  - Sources
  - Tests
  - App
excluded:
  - .build
  - DerivedData
  - Lumi.xcodeproj

disabled_rules:
  - trailing_comma
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool
  - unused_import
  - closure_spacing
  - contains_over_first_not_nil
  - convenience_type

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  excluded:
    - id
    - r
    - g
    - b
    - x
    - y

type_name:
  min_length: 2

function_body_length:
  warning: 80
  error: 160
